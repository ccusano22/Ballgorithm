name: Probe cbbdata (temporary)
on:
  workflow_dispatch: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests pyarrow pandas
      - env:
          CBD_USER: ${{ secrets.CBD_USER }}
          CBD_PW: ${{ secrets.CBD_PW }}
        run: python collect/probe_cbbdata.py
